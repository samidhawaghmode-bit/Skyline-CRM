    <div class="row">


        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-2 sidebar p-3">

            <h6 class="text-muted mb-3">

                MAIN MENU

            </h6>


            <ul class="nav flex-column">


                <li class="nav-item">

                    <a

                            href="dashboard.html">

                        Dashboard

                    </a>

                <li class="nav-item">

                    <a

                            href="allenquiry.html">

                        <i class="bi bi-person-lines-fill me-2"></i>

                        Enquiries

                    </a>

                </li>


                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="followUp.html">

                        <i class="bi bi-arrow-repeat me-2"></i>

                <li class="nav-item">

                            class="nav-link"

                <li class="nav-item"

                    <a

                            href="vendorpayment.html">

                        <i class="bi bi-building me-2"></i>

                        Vendor Payment

                    </a>

                </li>
                <li class="nav-item"
                    id="  employeePaymentMenu
">

                    <a

                            href="employeepayment.html">

                        <i class="bi bi-building me-2"></i>

                </li>


                <li class="nav-item">

                </li>

        <!-- ================= CONTENT ================= -->

        <div class="col-md-10 p-4">


            <!-- Heading -->

            <div class="mb-4">

                <h2 class="page-title">

                    Update Petty Cash

                </h2>

                <p class="text-muted">

                    Update petty cash expense details.

                </p>

            </div>



            <!-- ================= FORM ================= -->

            <div class="card form-card shadow-sm">

                <div class="card-body">

                    <form id="pettyCashForm">


                        <div class="row g-3">


                            <!-- Date -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="transactionDate">

                                    Transaction Date

                                </label>

                                <input
                                        type="date"
                                        class="form-control"
                                        id="transactionDate"
                                        required>

                            </div>



                            <!-- Expense Type -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="expenseType">

                                    Expense Type

                                </label>

                                <select
                                        class="form-select"
                                        id="expenseType"
                                        required>

                                    <option value="">

                                        Select Expense Type

                                    </option>

                                    <option value="Stationery">

                                        Stationery

                                    </option>

                                    <option value="Tea/Coffee">

                                        Tea/Coffee

                                    </option>

                                    <option value="Travel">

                                        Travel

                                    </option>

                                    <option value="Printing">

                                        Printing

                                    </option>

                                    <option value="Courier">

                                        Courier

                                    </option>

                                    <option value="Office Maintenance">

                                        Office Maintenance

                                    </option>

                                    <option value="Other">

                                        Other

                                    </option>

                                </select>

                            </div>



                            <!-- Particulars -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="particulars">

                                    Particulars

                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        id="particulars"
                                        required>

                            </div>



                            <!-- Paid To -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="paidTo">

                                    Paid To

                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        id="paidTo"
                                        required>

                            </div>



                            <!-- Amount -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="amount">

                                    Amount

                                </label>

                                <input
                                        type="number"
                                        class="form-control"
                                        id="amount"
                                        min="0"
                                        step="0.01"
                                        required>

                            </div>



                            <!-- Payment Mode -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="paymentMode">

                                    Payment Mode

                                </label>

                                <select
                                        class="form-select"
                                        id="paymentMode"
                                        required>

                                    <option value="">

                                        Select Payment Mode

                                    </option>

                                    <option value="Cash">

                                        Cash

                                    </option>

                                    <option value="UPI">

                                        UPI

                                    </option>

                                    <option value="Bank Transfer">

                                        Bank Transfer

                                    </option>

                                    <option value="Cheque">

                                        Cheque

                                    </option>

                                    <option value="Other">

                                        Other

                                    </option>

                                </select>

                            </div>



                            <!-- Remarks -->

                            <div class="col-12">

                                <label
                                        class="form-label"
                                        for="remarks">

                                    Remarks

                                </label>

                                <textarea
                                        class="form-control"
                                        id="remarks"
                                        rows="3"></textarea>

                            </div>


                        </div>



                        <!-- Buttons -->

                        <div class="mt-4">

                            <button
                                    type="submit"
                                    class="btn btn-primary me-2">

                                <i class="bi bi-check-circle me-1"></i>

                                Update Petty Cash

                            </button>


                            <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="goBack()">

                                <i class="bi bi-arrow-left me-1"></i>

                                Back

                            </button>

                        </div>


                    </form>

                </div>

            </div>


        </div>

    </div>

</div>



<script>

    const API_URL =
        "/skyline/dashboard/pettycash";


    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const editId =
        urlParams.get("id");



    document.addEventListener(
        "DOMContentLoaded",
        function() {

            if (!editId) {

                alert(
                    "Petty Cash ID not found."
                );

                window.location.href =
                    "pettycash.html";

                return;

            }


            loadPettyCash(editId);

        }
    );



    async function loadPettyCash(id) {

        try {

            const response =
                await fetch(
                    API_URL + "/" + id
                );


            if (!response.ok) {

                throw new Error(
                    "Petty Cash not found"
                );

            }


            const data =
                await response.json();


            document.getElementById(
                "transactionDate"
            ).value =
                data.transactionDate || "";


            document.getElementById(
                "expenseType"
            ).value =
                data.expenseType || "";


            document.getElementById(
                "particulars"
            ).value =
                data.particulars || "";


            document.getElementById(
                "paidTo"
            ).value =
                data.paidTo || "";


            document.getElementById(
                "amount"
            ).value =
                data.amount || "";


            document.getElementById(
                "paymentMode"
            ).value =
                data.paymentMode || "";


            document.getElementById(
                "remarks"
            ).value =
                data.remarks || "";

        }
        catch(error) {

            console.error(error);

            alert(
                "Failed to load petty cash."
            );

            window.location.href =
                "pettycash.html";

        }

    }



    document.getElementById(
        "pettyCashForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const pettyCash = {

                transactionDate:
                document.getElementById(
                    "transactionDate"
                ).value,

                expenseType:
                document.getElementById(
                    "expenseType"
                ).value,

                particulars:
                document.getElementById(
                    "particulars"
                ).value,

                paidTo:
                document.getElementById(
                    "paidTo"
                ).value,

                amount:
                document.getElementById(
                    "amount"
                ).value,

                paymentMode:
                document.getElementById(
                    "paymentMode"
                ).value,

                remarks:
                document.getElementById(
                    "remarks"
                ).value

            };


            try {

                const response =
                    await fetch(
                        API_URL + "/" + editId,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    pettyCash
                                )
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Update failed"
                    );

                }


                alert(
                    "Petty Cash updated successfully!"
                );


                window.location.href =
                    "pettycash.html";

            }
            catch(error) {

                console.error(error);

                alert(
                    "Failed to update petty cash."
                );

            }

        }
    );



    function goBack() {

        window.location.href =
            "pettycash.html";

    }



    function logout() {

        const confirmLogout =
            confirm(
                "Are you sure you want to logout?"
            );


        if (confirmLogout) {

            window.location.href =
                "login.html";

        }

    }

</script>
<script src="role.js"></script>
