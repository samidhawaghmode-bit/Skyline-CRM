<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Day Book - Skyline CRM</title>


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">


    <style>

        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
        }

        .sidebar .nav-link {
            color: #555;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: #eef4ff;
            color: #0d6efd;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .page-title {
            font-weight: 700;
        }

        .page-subtitle {
            color: #777;
        }

        .daybook-card {
            border: none;
            border-radius: 12px;
        }

        .form-title {
            font-size: 20px;
            font-weight: 700;
        }

        .form-subtitle {
            color: #777;
        }

        .section-line {
            border-top: 1px solid #eee;
            margin: 20px 0;
        }

        .required {
            color: red;
        }

        .back-btn {
            text-decoration: none;
            color: #0d6efd;
        }

    </style>

</head>


<body>


<!-- ================= TOP NAVBAR ================= -->

<nav class="navbar topbar px-4">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">
            Skyline CRM
        </span>


        <div>

            <span class="me-3">

                <i class="bi bi-person-circle"></i>
                <span id="loggedInUser">User</span>

            </span>


            <button
                    class="btn btn-outline-danger btn-sm"
                    onclick="logout()">

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </button>

        </div>

    </div>

</nav>



<div class="container-fluid">

    <div class="row">


        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-2 sidebar p-3">

            <h5 class="fw-bold mb-4">
                Dashboard
            </h5>


            <ul class="nav flex-column">

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="dashboard.html">

                        <i class="bi bi-speedometer2 me-2"></i>
                        Dashboard

                    </a>

                </li>


                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="allenquiry.html">

                        <i class="bi bi-person-lines-fill me-2"></i>
                        Enquiries

                    </a>

                </li>


                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="followup.html">

                        <i class="bi bi-arrow-repeat me-2"></i>
                        Follow Ups

                    </a>

                </li>


                <li class="nav-item">

                    <a
                            class="nav-link active"
                            href="daybook.html">

                        <i class="bi bi-journal-text me-2"></i>
                        Day Book

                    </a>

                </li>


                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="pettycash.html">

                        <i class="bi bi-wallet2 me-2"></i>
                        Petty Cash

                    </a>

                </li>


                <li class="nav-item" id="vendorPaymentMenu">

                    <a
                            class="nav-link"
                            href="vendorpayment.html">

                        <i class="bi bi-building me-2"></i>
                        Vendor Payment

                    </a>

                </li>

                <li class="nav-item" id="employeePaymentMenu">

                    <a
                            class="nav-link"
                            href="employeepayment.html">

                        <i class="bi bi-building me-2"></i>
                        Employee Payment

                    </a>

                </li>


                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="flatsale.html">

                        <i class="bi bi-house-check me-2"></i>
                        Flat Sales

                    </a>

                </li>

            </ul>

        </div>



        <!-- ================= CONTENT ================= -->

        <div class="col-md-10 p-4">


            <div class="mb-4">

                <a
                        href="daybook.html"
                        class="back-btn">

                    <i class="bi bi-arrow-left"></i>

                    Back to Day Book

                </a>


                <h2 class="page-title mt-2">
                    Add Day Book Entry
                </h2>


                <p class="page-subtitle">
                    Record a daily receipt or payment.
                </p>

            </div>



            <!-- ================= FORM CARD ================= -->

            <div class="card daybook-card shadow-sm">

                <div class="card-body p-4">


                    <div class="form-title">

                        <i class="bi bi-journal-plus me-2"></i>

                        Day Book Details

                    </div>


                    <div class="form-subtitle mt-1">

                        Enter the transaction details below.

                    </div>


                    <div class="section-line"></div>



                    <form id="dayBookForm">


                        <div class="row g-3">


                            <!-- DATE -->

                            <div class="col-md-4">

                                <label
                                        class="form-label"
                                        for="transactionDate">

                                    Transaction Date
                                    <span class="required">*</span>

                                </label>


                                <input
                                        type="date"
                                        class="form-control"
                                        id="transactionDate"
                                        required>

                            </div>



                            <!-- TYPE -->

                            <div class="col-md-4">

                                <label
                                        class="form-label"
                                        for="transactionType">

                                    Transaction Type
                                    <span class="required">*</span>

                                </label>


                                <select
                                        class="form-select"
                                        id="transactionType"
                                        required>

                                    <option value="">
                                        Select Type
                                    </option>

                                    <option value="Receipt">
                                        Receipt
                                    </option>

                                    <option value="Payment">
                                        Payment
                                    </option>

                                </select>

                            </div>



                            <!-- AMOUNT -->

                            <div class="col-md-4">

                                <label
                                        class="form-label"
                                        for="amount">

                                    Amount
                                    <span class="required">*</span>

                                </label>


                                <input
                                        type="number"
                                        class="form-control"
                                        id="amount"
                                        min="0"
                                        step="0.01"
                                        placeholder="Enter amount"
                                        required>

                            </div>



                            <!-- PARTICULARS -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="particulars">

                                    Particulars
                                    <span class="required">*</span>

                                </label>


                                <input
                                        type="text"
                                        class="form-control"
                                        id="particulars"
                                        placeholder="e.g. Flat booking amount"
                                        required>

                            </div>



                            <!-- REFERENCE -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="referenceName">

                                    Customer / Vendor / Reference

                                </label>


                                <input
                                        type="text"
                                        class="form-control"
                                        id="referenceName"
                                        placeholder="Enter reference name">

                            </div>



                            <!-- PAYMENT MODE -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="paymentMode">

                                    Payment Mode
                                    <span class="required">*</span>

                                </label>


                                <select
                                        class="form-select"
                                        id="paymentMode"
                                        required>

                                    <option value="">
                                        Select Payment Mode
                                    </option>

                                    <option value="Cash">
                                        Cash
                                    </option>

                                    <option value="UPI">
                                        UPI
                                    </option>

                                    <option value="Bank Transfer">
                                        Bank Transfer
                                    </option>

                                    <option value="Cheque">
                                        Cheque
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>



                            <!-- REMARKS -->

                            <div class="col-md-6">

                                <label
                                        class="form-label"
                                        for="remarks">

                                    Remarks

                                </label>


                                <textarea
                                        class="form-control"
                                        id="remarks"
                                        rows="3"
                                        placeholder="Additional information"></textarea>

                            </div>


                        </div>



                        <div class="section-line"></div>



                        <div class="d-flex justify-content-end gap-2">


                            <button
                                    type="button"
                                    class="btn btn-secondary"
                                    onclick="clearForm()">

                                Clear

                            </button>


                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-circle me-1"></i>

                                Save Entry

                            </button>


                        </div>


                    </form>

                </div>

            </div>


        </div>

    </div>

</div>



<script>

    // Today's date

    document.getElementById(
        "transactionDate"
    ).value =
        new Date().toISOString().split("T")[0];



    // ============================
    // SAVE
    // ============================

    document.getElementById(
        "dayBookForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const dayBook = {

                transactionDate:
                document.getElementById(
                    "transactionDate"
                ).value,

                transactionType:
                document.getElementById(
                    "transactionType"
                ).value,

                particulars:
                document.getElementById(
                    "particulars"
                ).value,

                referenceName:
                document.getElementById(
                    "referenceName"
                ).value,

                amount:
                document.getElementById(
                    "amount"
                ).value,

                paymentMode:
                document.getElementById(
                    "paymentMode"
                ).value,

                remarks:
                document.getElementById(
                    "remarks"
                ).value

            };


            try {

                const response =
                    await fetch(
                        "/skyline/dashboard/daybook",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(dayBook)
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to save"
                    );

                }


                alert(
                    "Day Book entry saved successfully!"
                );


                window.location.href =
                    "daybook.html";


            } catch (error) {

                console.error(error);

                alert(
                    "Server connection failed."
                );

            }

        }
    );



    // ============================
    // CLEAR
    // ============================

    function clearForm() {

        document.getElementById(
            "dayBookForm"
        ).reset();


        document.getElementById(
            "transactionDate"
        ).value =
            new Date().toISOString().split("T")[0];

    }



    // ============================
    // LOGOUT
    // ============================

    function logout() {

        const confirmLogout =
            confirm(
                "Are you sure you want to logout?"
            );


        if (confirmLogout) {

            window.location.href =
                "/login.html";

        }

    }

</script>
<script src="role.js"></script>

</body>

</html>
