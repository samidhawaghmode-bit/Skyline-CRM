<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update User - Skyline CRM</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <style>

        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: rgb(31, 41, 55);
        }

        .navbar-brand,
        .navbar .nav-link,
        .navbar span {
            color: white !important;
        }

        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
        }

        .sidebar .nav-link {
            color: #333;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .sidebar .nav-link:hover {
            background-color: #f1f3f5;
        }

        .update-card {
            max-width: 600px;
            margin: 40px auto;
        }

    </style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="dashboard.html">
            Skyline CRM
        </a>

        <div class="ms-auto d-flex align-items-center">

            <span id="loggedInUser" class="me-3">
                User
            </span>

            <button
                    class="btn btn-outline-light btn-sm"
                    onclick="logout()">

                <i class="bi bi-box-arrow-right me-1"></i>
                Logout

            </button>

        </div>

    </div>

</nav>


<!-- Main Layout -->
<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">

            <h6 class="text-muted mb-3">
                MENU
            </h6>

            <ul class="nav flex-column">

                <li class="nav-item">
                    <a class="nav-link"
                       href="dashboard.html">

                        <i class="bi bi-speedometer2 me-2"></i>
                        Dashboard

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="enquiry.html">

                        <i class="bi bi-question-circle me-2"></i>
                        Enquiry

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="followup.html">

                        <i class="bi bi-telephone me-2"></i>
                        Follow Up

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="lead.html">

                        <i class="bi bi-person-lines-fill me-2"></i>
                        Lead

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="daybook.html">

                        <i class="bi bi-journal-text me-2"></i>
                        Day Book

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="pettycash.html">

                        <i class="bi bi-wallet2 me-2"></i>
                        Petty Cash

                    </a>
                </li>

                <!-- Admin Only -->
                <li class="nav-item"
                    id="vendorPaymentMenu">

                    <a class="nav-link"
                       href="vendorpayment.html">

                        <i class="bi bi-cash-stack me-2"></i>
                        Vendor Payment

                    </a>

                </li>

                <!-- Admin Only -->
                <li class="nav-item"
                    id="employeePaymentMenu">

                    <a class="nav-link"
                       href="employeepayment.html">

                        <i class="bi bi-person-badge me-2"></i>
                        Employee Payment

                    </a>

                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="flatsale.html">

                        <i class="bi bi-house-check me-2"></i>
                        Flat Sale

                    </a>
                </li>

            </ul>

        </div>


        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <h3 class="fw-bold mb-4">
                Update User
            </h3>


            <div class="card border-0 shadow-sm update-card">

                <div class="card-body p-4">

                    <!-- Icon -->
                    <div class="text-center mb-4">

                        <div
                                class="mx-auto d-flex align-items-center justify-content-center"
                                style="
                                width:70px;
                                height:70px;
                                border-radius:15px;
                                background:#fff3cd;
                                color:#856404;
                                font-size:30px;
                            ">

                            <i class="bi bi-person-gear"></i>

                        </div>

                        <h5 class="fw-bold mt-3">
                            Update User Details
                        </h5>

                        <p class="text-muted">
                            Enter the User ID and update the details
                        </p>

                    </div>


                    <!-- Form -->
                    <form id="updateUserForm">

                        <!-- User ID -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                User ID
                            </label>

                            <input
                                    type="number"
                                    class="form-control"
                                    id="userId"
                                    placeholder="Enter User ID"
                                    required>

                        </div>


                        <!-- Username -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Username
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    placeholder="Enter username"
                                    required>

                        </div>


                        <!-- Role -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Role
                            </label>

                            <select
                                    class="form-select"
                                    id="role"
                                    required>

                                <option value="">
                                    Select Role
                                </option>

                                <option value="ADMIN">
                                    ADMIN
                                </option>

                                <option value="EMPLOYEE">
                                    EMPLOYEE
                                </option>

                            </select>

                        </div>


                        <!-- Update Button -->
                        <div class="d-grid">

                            <button
                                    type="submit"
                                    class="btn btn-warning">

                                <i class="bi bi-pencil-square me-2"></i>
                                Update User

                            </button>

                        </div>

                    </form>


                    <!-- Message -->
                    <div id="message"
                         class="mt-3">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="update-user.js"></script>
<script src="role.js"></script>

</body>

</html>
