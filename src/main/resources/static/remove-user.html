<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Remove User - Skyline CRM</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">


    <style>

        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }


        /* ==============================
           NAVBAR
           ============================== */

        .navbar {
            background-color: rgb(31, 41, 55);
        }


        /* ==============================
           SIDEBAR
           ============================== */

        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
        }


        .sidebar .nav-link {
            color: #374151;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 5px;
        }


        .sidebar .nav-link:hover {
            background-color: #f1f5f9;
        }


        .sidebar .nav-link.active {
            background-color: #ffe5e5;
            color: #dc3545;
            font-weight: 600;
        }


        /* ==============================
           MAIN CONTENT
           ============================== */

        .main-content {
            padding: 25px;
        }


        /* ==============================
           REMOVE CARD
           ============================== */

        .remove-card {
            max-width: 600px;
            margin: 30px auto;
        }


        .remove-icon {

            width: 70px;
            height: 70px;

            border-radius: 15px;

            background-color: #ffe5e5;

            color: #dc3545;

            font-size: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 20px;

        }


        /* ==============================
           BACK BUTTON
           ============================== */

        .back-btn {

            font-size: 13px;

            color: #4f46e5;

            text-decoration: none;

        }


        .back-btn:hover {

            color: #3730a3;

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-dark">

    <div class="container-fluid">


        <!-- Logo -->

        <a class="navbar-brand"
           href="dashboard.html">

            <i class="bi bi-buildings"></i>

            SKYLINE CRM

        </a>


        <!-- User -->

        <div class="text-white">

            <span class="me-3">

                <i class="bi bi-person-circle"></i>

                <span id="loggedInUser">
                    Admin
                </span>

            </span>


            <button
                    class="btn btn-outline-light btn-sm"
                    onclick="logout()">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </div>

    </div>

</nav>



<!-- =====================================================
     MAIN AREA
     ===================================================== -->

<div class="container-fluid">

    <div class="row">


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <div class="col-md-2 sidebar p-3">


            <h6 class="text-muted mb-3">

                MAIN MENU

            </h6>


            <ul class="nav flex-column">


                <!-- Dashboard -->

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="dashboard.html">

                        <i class="bi bi-speedometer2 me-2"></i>

                        Dashboard

                    </a>

                </li>


                <!-- Enquiries -->

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="allenquiry.html">

                        <i class="bi bi-person-lines-fill me-2"></i>

                        Enquiries

                    </a>

                </li>


                <!-- Follow Up -->

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="followup.html">

                        <i class="bi bi-arrow-repeat me-2"></i>

                        Follow Up

                    </a>

                </li>


                <!-- Lead -->

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="Lead.html">

                        <i class="bi bi-people me-2"></i>

                        Lead

                    </a>

                </li>


                <!-- Day Book -->

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="daybook.html">

                        <i class="bi bi-journal-text me-2"></i>

                        Day Book

                    </a>

                </li>


                <!-- Petty Cash -->

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="pettycash.html">

                        <i class="bi bi-wallet2 me-2"></i>

                        Petty Cash

                    </a>

                </li>


                <!-- Vendor Payment -->

                <li class="nav-item"
                    id="vendorPaymentMenu">

                    <a
                            class="nav-link"
                            href="vendorpayment.html">

                        <i class="bi bi-building me-2"></i>

                        Vendor Payment

                    </a>

                </li>


                <!-- Employee Payment -->

                <li class="nav-item"
                    id="employeePaymentMenu">

                    <a
                            class="nav-link"
                            href="employeepayment.html">

                        <i class="bi bi-cash-stack me-2"></i>

                        Employee Payment

                    </a>

                </li>


                <!-- Flat Sales -->

                <li class="nav-item">

                    <a
                            class="nav-link"
                            href="flatsale.html">

                        <i class="bi bi-house-check me-2"></i>

                        Flat Sales

                    </a>

                </li>


            </ul>

        </div>



        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <div class="col-md-10 main-content">


            <!-- Heading -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h4 class="fw-bold mb-1">

                        Remove User

                    </h4>

                    <p class="text-muted mb-0">

                        Remove an existing user

                    </p>

                </div>


                <a
                        href="dashboard.html"
                        class="back-btn">

                    <i class="bi bi-arrow-left me-1"></i>

                    Back to Dashboard

                </a>

            </div>



            <!-- =================================================
                 REMOVE USER CARD
                 ================================================= -->

            <div class="card border-0 shadow-sm remove-card">

                <div class="card-body p-5 text-center">


                    <!-- Icon -->

                    <div class="remove-icon">

                        <i class="bi bi-person-dash-fill"></i>

                    </div>


                    <h5 class="fw-bold">

                        Remove User

                    </h5>


                    <p class="text-muted">

                        Enter the User ID of the user
                        you want to remove.

                    </p>


                    <!-- Form -->

                    <form id="removeUserForm">


                        <div class="text-start mb-3">

                            <label
                                    for="userId"
                                    class="form-label fw-semibold">

                                User ID

                            </label>


                            <input
                                    type="number"
                                    id="userId"
                                    class="form-control"
                                    placeholder="Enter User ID"
                                    required>

                        </div>


                        <button
                                type="submit"
                                class="btn btn-danger w-100">

                            <i class="bi bi-trash me-2"></i>

                            Remove User

                        </button>

                    </form>


                    <!-- Message -->

                    <div
                            id="message"
                            class="mt-3">
                    </div>


                </div>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="remove-user.js"></script>

<script src="role.js"></script>


</body>

</html>
