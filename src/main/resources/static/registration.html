<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register User - Skyline CRM</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f6fa;
        }

        .registration-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .registration-card {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            font-weight: 600;
        }

        .btn-register {
            width: 100%;
            margin-top: 10px;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="registration-container">

    <div class="registration-card">

        <div class="title">
            <h2>Register User</h2>
            <p class="text-muted">Skyline CRM</p>
        </div>

        <form id="registrationForm">

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">Username</label>

                <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter username"
                        required
                >
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>

                <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                >
            </div>

            <!-- Role -->
            <div class="mb-3">
                <label class="form-label">Role</label>

                <select id="role" class="form-select" required>

                    <option value="">Select Role</option>

                    <option value="EMPLOYEE">
                        Employee
                    </option>

                    <option value="ADMIN">
                        Admin
                    </option>

                </select>
            </div>

            <button
                    type="submit"
                    class="btn btn-primary btn-register"
            >
                Register User
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>

</div>

<script src="registration.js"></script>

</body>
</html>
