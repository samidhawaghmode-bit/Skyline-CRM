    <!-- Bootstrap Icons -->

            rel="stylesheet">


    <!-- Dashboard CSS -->

</head>


<body>

<!-- ================= MAIN LAYOUT ================= -->

    <div class="row">


        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-2 sidebar p-3">

            <h6 class="mb-3">

            </h6>


            <a

                    class="nav-link">

                Dashboard

            </a>


            <a
                    href="allenquiry.html"
                    class="nav-link">

                <i class="bi bi-person-lines-fill me-2"></i>
                Enquiries

            </a>


            <a
                    href="followup.html"
                    class="nav-link">

                <i class="bi bi-telephone me-2"></i>
                Follow Up

            </a>


            <a
                    href="lead.html"
                    class="nav-link">

                <i class="bi bi-people me-2"></i>
                Lead

            </a>


            <a
                    href="daybook.html"
                    class="nav-link">

                <i class="bi bi-book me-2"></i>
                Day Book

            </a>


            <a
                    href="pettycash.html"
                    class="nav-link">

                <i class="bi bi-cash-stack me-2"></i>
                Petty Cash

            </a>


            <a
                    href="vendorpayment.html"
                    class="nav-link"
                    id="vendorPaymentMenu">

                <i class="bi bi-credit-card me-2"></i>
                Vendor Payment

            </a>


            <a
                    href="employeepayment.html"
                    class="nav-link active"
            id="employeePaymentMenu">

                <i class="bi bi-wallet2 me-2"></i>
                Employee Payment

            </a>


            <a
                    href="flatsale.html"
                    class="nav-link">

                <i class="bi bi-house me-2"></i>
                Flat Sales

            </a>

        </div>



        <!-- ================= CONTENT ================= -->

        <div class="col-md-10 p-4">


            <!-- PAGE HEADER -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h4 class="dashboard-title mb-1">
                        Employee Payment
                    </h4>

                    <small class="text-muted">
                        Manage employee payments
                    </small>

                </div>


                <button
                        class="btn btn-primary"
                        onclick="addEmployeePayment()">

                    <i class="bi bi-plus-circle me-1"></i>
                    Add Employee Payment

                </button>

            </div>



            <!-- ================= SUMMARY CARDS ================= -->

            <div class="row g-3 mb-4">


                <!-- Total Entries -->

                <div class="col-md-6">

                    <div class="card dashboard-card shadow-sm">

                        <div class="card-body">

                            <div class="d-flex align-items-center">

                                <div class="card-icon icon-blue me-3">

                                    <i class="bi bi-wallet2"></i>

                                </div>


                                <div>

                                    <small class="text-muted">
                                        Total Payments
                                    </small>

                                    <h4
                                            class="mb-0"
                                            id="totalEntries">

                                        0

                                    </h4>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>



                <!-- Total Amount -->

                <div class="col-md-6">

                    <div class="card dashboard-card shadow-sm">

                        <div class="card-body">

                            <div class="d-flex align-items-center">

                                <div class="card-icon icon-green me-3">

                                    <i class="bi bi-cash-stack"></i>

                                </div>


                                <div>

                                    <small class="text-muted">
                                        Total Amount
                                    </small>

                                    <h4
                                            class="mb-0"
                                            id="totalAmount">

                                        ₹0

                                    </h4>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


            </div>



            <!-- ================= TABLE ================= -->

            <div class="card dashboard-card shadow-sm">

                <div class="card-body">


                    <h5 class="mb-3">
                        Employee Payment Records
                    </h5>


                    <div class="table-responsive">

                        <table class="table align-middle">

                            <thead>

                            <tr>

                                <th>ID</th>

                                <th>Date</th>

                                <th>Employee Name</th>

                                <th>Amount</th>

                                <th>Payment Mode</th>

                                <th>Remarks</th>

                                <th>Action</th>

                            </tr>

                            </thead>


                            <tbody id="employeePaymentTableBody">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>



<!-- ================= JAVASCRIPT ================= -->

<script>

    const API_URL =
        "/skyline/dashboard/employeepayment";


    window.addEventListener(
        "DOMContentLoaded",
        function () {

            loadEmployeePayments();

        }
    );



    async function loadEmployeePayments() {

        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    "Failed to load employee payments"
                );

            }


            const data =
                await response.json();


            displayEmployeePayments(data);

        }
        catch (error) {

            console.error(error);

            alert(
                "Failed to load employee payments."
            );

        }

    }



    function displayEmployeePayments(data) {

        const tableBody =
            document.getElementById(
                "employeePaymentTableBody"
            );


        tableBody.innerHTML = "";


        let totalAmount = 0;


        data.forEach(function (payment) {

            const amount =
                parseFloat(payment.amount) || 0;


            totalAmount += amount;


            const row = `

            <tr>

                <td>${payment.id}</td>

                <td>${payment.paymentDate || ""}</td>

                <td>${payment.employeeName || ""}</td>

                <td>
                    ₹${amount.toFixed(2)}
                </td>

                <td>
                    ${payment.paymentMode || ""}
                </td>

                <td>
                    ${payment.remarks || ""}
                </td>

                <td>

                    <button
                        class="btn btn-sm btn-outline-primary me-1"
                        onclick="editEmployeePayment(${payment.id})">

                        <i class="bi bi-pencil"></i>

                    </button>


                    <button
                        class="btn btn-sm btn-outline-danger"
                        onclick="deleteEmployeePayment(${payment.id})">

                        <i class="bi bi-trash"></i>

                    </button>

                </td>

            </tr>

        `;


            tableBody.innerHTML += row;

        });


        document.getElementById(
            "totalEntries"
        ).innerText = data.length;


        document.getElementById(
            "totalAmount"
        ).innerText =
            "₹" + totalAmount.toFixed(2);

    }



    function addEmployeePayment() {

        window.location.href =
            "add-employeepayment.html";

    }



    function editEmployeePayment(id) {

        window.location.href =
            "update-employeepayment.html?id=" + id;

    }



    async function deleteEmployeePayment(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this employee payment?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    API_URL + "/" + id,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }


            alert(
                "Employee Payment deleted successfully!"
            );


            loadEmployeePayments();

        }
        catch (error) {

            console.error(error);

            alert(
                "Failed to delete employee payment."
            );

        }

    }



    function logout() {

        const confirmLogout =
            confirm(
                "Are you sure you want to logout?"
            );


        if (confirmLogout) {

            window.location.href =
                "/login.html";

        }

    }

</script>
<script src="role.js"></script>

</body>

</html>
